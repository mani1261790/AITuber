name: Deploy AITuber to Cloudflare
run-name: AITuber deploy ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: CLI request identifier
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: aituber-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 2ea670c2a6ff28e248ef084adf095e8b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify target account before mutations
        run: pnpm verify:cloud-account
      - run: pnpm --filter @aituber/server... build
      - name: Verify authentication and providers
        run: pnpm exec vitest run apps/cloudflare/src/auth.test.ts apps/cloudflare/src/audio-response.test.ts packages/providers/src/llm.test.ts apps/classroom/src/teacher-attention.test.ts apps/classroom/src/teacher-motion.test.ts apps/classroom/src/light-walk.test.ts apps/classroom/src/foot-contact.test.ts apps/classroom/src/standing-motion.test.ts apps/classroom/src/stage-locomotion.test.ts apps/classroom/src/standing-recovery.test.ts apps/classroom/src/motion-retarget.test.ts apps/server/src/cloud-recovery.test.ts apps/server/src/course-authoring-service.test.ts apps/cloudflare/src/platform/ajv.test.ts
      - name: Generate Worker types
        run: pnpm exec wrangler types --config apps/cloudflare/wrangler.jsonc apps/cloudflare/worker-configuration.d.ts
      - run: pnpm --filter @aituber/cloudflare typecheck
      - run: pnpm build:cloudflare
      - run: pnpm verify:cloud-native
      - name: Build and deploy
        run: pnpm deploy:cloudflare
        env:
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      - name: Verify public and private boundaries
        run: node scripts/verify-cloud-public.mjs
