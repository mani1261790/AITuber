name: Deploy AITuber to Cloudflare
run-name: AITuber deploy ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: CLI request identifier
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: aituber-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 2ea670c2a6ff28e248ef084adf095e8b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify target account before mutations
        run: pnpm verify:cloud-account
      - run: pnpm --filter @aituber/server... build
      - name: Verify authentication and providers
        run: pnpm exec vitest run apps/cloudflare/src/auth.test.ts apps/cloudflare/src/login.test.ts apps/cloudflare/src/audio-response.test.ts packages/providers/src/llm.test.ts packages/providers/src/chatgpt.test.ts apps/server/src/chatgpt-connection.test.ts apps/cloudflare/src/chatgpt-routes.test.ts packages/providers/src/speech.test.ts apps/classroom/src/teacher-attention.test.ts apps/classroom/src/audience-scan.test.ts apps/classroom/src/teacher-motion.test.ts apps/classroom/src/light-walk.test.ts apps/classroom/src/foot-contact.test.ts apps/classroom/src/standing-motion.test.ts apps/classroom/src/stage-locomotion.test.ts apps/classroom/src/board-erase.test.ts apps/classroom/src/eraser-grip.test.ts apps/classroom/src/stage-prop-motion.test.ts apps/classroom/src/board-reveal.test.ts apps/server/src/board-preview.test.ts apps/classroom/src/board-markdown.test.tsx apps/classroom/src/lesson-texture.test.tsx apps/server/src/blackboard-markdown.test.ts apps/server/src/lesson-director.test.ts apps/server/src/package-editor-service.test.ts apps/server/src/whole-lecture-planner.test.ts apps/server/src/prepared-readings.test.ts apps/server/src/teacher-language.test.ts apps/server/src/live-supplement-service.test.ts apps/server/src/pedagogy-service.test.ts apps/server/src/question-queue-service.test.ts apps/classroom/src/standing-recovery.test.ts apps/classroom/src/motion-retarget.test.ts apps/server/src/cloud-recovery.test.ts apps/server/src/course-authoring-service.test.ts apps/server/src/authoring-identifiers.test.ts apps/server/src/fixed-lecture-service.test.ts apps/cloudflare/src/platform/ajv.test.ts apps/cloudflare/src/storage-error.test.ts apps/cloudflare/src/platform/storage-budget.test.ts apps/server/src/authoring-list-cache.test.ts apps/server/src/llm-settings-store.test.ts apps/server/src/live-execution.test.ts apps/server/src/source-ingestion.test.ts apps/server/src/authoring-plan-validation.test.ts apps/server/src/app.test.ts apps/classroom/src/pdf-slide-layout.test.ts apps/classroom/src/speech-playback.test.ts apps/classroom/src/speech-caption.test.ts apps/classroom/src/classroom-camera.test.ts packages/contracts/src/course-package.test.ts
      - name: Generate Worker types
        run: pnpm exec wrangler types --config apps/cloudflare/wrangler.jsonc apps/cloudflare/worker-configuration.d.ts
      - run: pnpm --filter @aituber/cloudflare typecheck
      - name: Verify operator types
        run: pnpm --filter @aituber/operator typecheck
      - run: pnpm build:cloudflare
      - run: pnpm verify:cloud-native
      - name: Verify bounded storage usage and restart safety
        run: node scripts/measure-cloud-storage.mjs
      - name: Build and deploy
        run: pnpm deploy:cloudflare
        env:
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
          CHATGPT_CLIENT_ID: ${{ secrets.CHATGPT_CLIENT_ID }}
          CHATGPT_CLIENT_SECRET: ${{ secrets.CHATGPT_CLIENT_SECRET }}
          CHATGPT_REDIRECT_URI: ${{ secrets.CHATGPT_REDIRECT_URI }}
          CHATGPT_PLAN_USAGE_ENABLED: ${{ secrets.CHATGPT_PLAN_USAGE_ENABLED }}
      - name: Verify public and private boundaries
        run: node scripts/verify-cloud-public.mjs
      - name: Verify authenticated operator rollout
        run: node scripts/verify-cloud-operator.mjs
        env:
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
