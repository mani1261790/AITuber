name: Deploy AITuber to Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aituber-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_ACCOUNT_ID: 2ea670c2a6ff28e248ef084adf095e8b
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify target account before mutations
        run: pnpm verify:cloud-account
      - name: Verify authentication and providers
        run: pnpm exec vitest run apps/cloudflare/src/auth.test.ts packages/providers/src/llm.test.ts
      - name: Generate Worker types
        run: pnpm exec wrangler types --config apps/cloudflare/wrangler.jsonc apps/cloudflare/worker-configuration.d.ts
      - run: pnpm --filter @aituber/cloudflare typecheck
      - name: Build and deploy
        run: pnpm deploy:cloudflare
        env:
          OPERATOR_PASSWORD: ${{ secrets.OPERATOR_PASSWORD }}
          STATE_SECRET: ${{ secrets.STATE_SECRET }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_VOICE_ID: ${{ secrets.FISH_VOICE_ID }}
      - name: Verify public and private boundaries
        run: |
          test "$(curl --retry 3 --retry-delay 5 --silent --show-error --output /dev/null --write-out '%{http_code}' https://aituber.mani1261790.workers.dev/login)" = 200
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://aituber.mani1261790.workers.dev/api/courses)" = 401
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' https://aituber.mani1261790.workers.dev/_internal/state)" = 404
